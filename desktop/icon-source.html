<!DOCTYPE html>
<!-- 应用图标（常规版）：深翡翠圆角底 + 白色黑桃 + 右上红心。
     · 黑桃是主标记：小尺寸下"绿底 + 白桃"的轮廓不依赖细节，16px 仍可辨认；
     · 红心是品牌呼应（顶栏 brand 就是 ♥♠）兼识别色：唯一的高饱和暖色，
       即使缩到 16px 退化成一个红点，也比纯绿白图标更容易一眼找到；
     · 红心自带深色描边，而不是叠一圈外描边——小尺寸下描边宽度不可控会糊。
     常规版用于 >=64px：保留柔光晕与投影，做出珐琅质感。 -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent}
  .icon{
    position:relative;width:1024px;height:1024px;border-radius:230px;overflow:hidden;
    background:
      radial-gradient(62% 46% at 26% 10%, rgba(255,255,255,.30), rgba(255,255,255,0) 66%),
      linear-gradient(152deg,#31B87D 0%,#189A63 22%,#0A5F3E 58%,#04301F 100%);
  }
  .icon::after{
    content:"";position:absolute;inset:0;border-radius:230px;
    box-shadow:
      inset 0 0 0 8px rgba(255,255,255,.13),
      inset 0 12px 30px rgba(255,255,255,.14),
      inset 0 -46px 76px rgba(0,0,0,.34);
  }
  .spade{
    position:absolute;left:8.5%;top:19.5%;width:67%;height:67%;
    filter:drop-shadow(0 14px 26px rgba(0,18,10,.40));
  }
  .heart{
    position:absolute;right:9%;top:9%;width:32%;height:32%;
    filter:drop-shadow(0 9px 16px rgba(0,18,10,.34));
  }
</style></head><body>
<div class="icon">
  <svg class="spade" viewBox="4 2 16 21" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="suit" x1="0.12" y1="0" x2="0.55" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="0.55" stop-color="#F5FCF8"/>
        <stop offset="1" stop-color="#CDE7D8"/>
      </linearGradient>
    </defs>
    <path fill="url(#suit)" d="M12 2C12 2 4 8.5 4 14c0 3.3 2.2 5.5 5 5.5 1.6 0 2.6-.9 3-2.1L11 23h2l-1-5.6c.4 1.2 1.4 2.1 3 2.1 2.8 0 5-2.2 5-5.5C20 8.5 12 2 12 2z"/>
  </svg>
  <svg class="heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path fill="#E4364B" stroke="#062E1E" stroke-width="1.9" stroke-linejoin="round"
          d="M12 21s-8.4-5.4-8.4-11.4A4.9 4.9 0 0 1 12 6.4a4.9 4.9 0 0 1 8.4 3.2C20.4 15.6 12 21 12 21z"/>
  </svg>
</div>
</body></html>
